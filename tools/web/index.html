<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOF97 Mod Studio</title>
<style>
  :root {
    --bg: #0A0B0E;
    --panel: #121319;
    --panel2: #181A22;
    --panel3: #20232E;
    --ink: #F2F3F7;
    --mute: #72768A;
    --line: rgba(255, 255, 255, 0.08);
    --accent: #FFB319;
    --accent-glow: rgba(255, 179, 25, 0.35);
    --ok: #34D399;
    --danger: #F87171;
    --warn: #FBBF24;
    --coat: #3A3A4A;
    --shirt: #F7F7FF;
    --hair: #DE3A21;
    --pants: #AD2910;
    --shoes: #191929;
    --skin: #F7C584;
    --glow: #DE3A21;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei UI", sans-serif;
    user-select: none;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg); color: var(--ink); }

  /* App Layout */
  .app {
    display: grid;
    grid-template-columns: 74px 1fr;
    height: 100vh;
    width: 100vw;
    background: var(--bg);
    position: relative;
  }

  /* Left Rail */
  .rail {
    background: var(--panel);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 0 16px;
    gap: 12px;
    border-right: 1px solid var(--line);
    z-index: 10;
  }
  .logo {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, #FFC038, #FF9500);
    margin-bottom: 20px;
    display: grid;
    place-items: center;
    color: #111;
    font-weight: 900;
    font-size: 16px;
    box-shadow: 0 8px 20px -4px rgba(255, 160, 0, 0.5);
    cursor: default;
  }
  .nav {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    border: 0;
    background: transparent;
    color: var(--mute);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all 0.22s ease;
    position: relative;
  }
  .nav:hover {
    color: var(--ink);
    background: var(--panel2);
    transform: translateY(-1px);
  }
  .nav.on {
    color: #111;
    background: var(--accent);
    box-shadow: 0 6px 18px -4px var(--accent-glow);
  }
  .nav svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .rail-spacer { flex: 1; }
  .status-led {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 10px var(--ok);
    transition: 0.3s;
  }

  /* Main Viewport */
  .main {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    height: 100vh;
    overflow: hidden;
  }
  .page {
    display: none;
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: hidden;
  }
  .page.on {
    display: block;
    animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: none; }
  }

  /* ========================================================================= */
  /* Page 1: Skin & Palette Stage (3-Column Layout)                            */
  /* ========================================================================= */
  .skin-layout {
    display: grid;
    grid-template-columns: 240px 1fr 270px;
    height: calc(100vh - 76px);
  }

  /* Left Column: Character List */
  .char-list-col {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: 100%;
  }
  .char-list-header {
    padding: 18px 18px 14px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--mute);
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .char-list-header .badge {
    background: rgba(255, 255, 255, 0.08);
    color: #C2C5D6;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .char-scroll-box {
    flex: 1;
    overflow-y: auto;
    padding: 10px 8px 18px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 0;
  }
  .char-scroll-box::-webkit-scrollbar, .theme-sidebar::-webkit-scrollbar {
    width: 5px;
  }
  .char-scroll-box::-webkit-scrollbar-thumb, .theme-sidebar::-webkit-scrollbar-thumb {
    background: #282B38;
    border-radius: 5px;
  }

  .char-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 12px;
    border-radius: 12px;
    cursor: pointer;
    background: transparent;
    border: 1px solid transparent;
    transition: all 0.18s ease;
  }
  .char-row:hover {
    background: rgba(255, 255, 255, 0.04);
  }
  .char-row.on {
    background: #1B1E29;
    border-color: rgba(255, 179, 25, 0.7);
    box-shadow: 0 4px 16px -4px rgba(0, 0, 0, 0.6);
  }
  .char-row-left {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
  }
  .char-row .idx {
    font-size: 11px;
    font-weight: 700;
    color: var(--mute);
    width: 18px;
    flex: none;
    font-family: "Cascadia Mono", Consolas, monospace;
  }
  .char-row.on .idx { color: var(--accent); font-weight: 800; }
  .char-row .name {
    font-size: 13.5px;
    font-weight: 600;
    color: #DDE0EC;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .char-row.on .name { color: #FFF; font-weight: 700; }

  /* Current skin badge on character row */
  .char-skin-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.05);
    font-size: 11px;
    color: #A4A8BC;
    flex: none;
    transition: 0.2s;
    border: 1px solid transparent;
  }
  .char-skin-tag.modded {
    background: rgba(255, 179, 25, 0.16);
    color: #FFC038;
    font-weight: 700;
    border: 1px solid rgba(255, 179, 25, 0.45);
    box-shadow: 0 0 10px rgba(255, 179, 25, 0.15);
  }
  .char-skin-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    display: inline-block;
  }

  /* Center Column: Hero Stage */
  .hero-stage {
    position: relative;
    overflow: hidden;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 50%, #151720 0%, var(--bg) 80%);
  }
  .watermark {
    position: absolute;
    left: 28px;
    top: 48%;
    transform: translateY(-50%);
    writing-mode: vertical-rl;
    font-size: clamp(60px, 10vw, 110px);
    font-weight: 900;
    color: transparent;
    -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.06);
    letter-spacing: 12px;
    pointer-events: none;
    line-height: 1;
    white-space: nowrap;
    transition: 0.3s;
  }
  .halo-glow {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--glow) 0%, transparent 64%);
    opacity: 0.28;
    filter: blur(55px);
    transition: background 0.5s ease;
    pointer-events: none;
  }
  .figure-box {
    position: relative;
    height: 82%;
    max-height: 480px;
    aspect-ratio: 240 / 400;
    filter: drop-shadow(0 30px 34px rgba(0, 0, 0, 0.7));
    transition: transform 0.3s ease;
  }
  .figure-box svg { width: 100%; height: 100%; overflow: visible; }
  .figure-box svg * { transition: fill 0.35s ease; }

  /* Current Character Active Pill (Center Bottom) */
  .active-char-banner {
    position: absolute;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(24, 26, 34, 0.88);
    backdrop-filter: blur(12px);
    padding: 7px 18px;
    border-radius: 999px;
    border: 1px solid var(--line);
    box-shadow: 0 10px 24px -6px rgba(0, 0, 0, 0.6);
  }
  .active-char-banner .cname {
    font-size: 15px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.5px;
  }
  .active-char-banner .tname {
    font-size: 12.5px;
    color: var(--accent);
    font-weight: 600;
  }

  /* Scope switch (Top Right of Stage) */
  .scope-pill {
    position: absolute;
    right: 24px;
    top: 20px;
    display: flex;
    background: rgba(24, 26, 34, 0.88);
    backdrop-filter: blur(12px);
    border-radius: 999px;
    padding: 4px;
    border: 1px solid var(--line);
    z-index: 5;
  }
  .scope-pill button {
    border: 0;
    background: transparent;
    color: var(--mute);
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 600;
    font-family: inherit;
    transition: 0.2s;
  }
  .scope-pill button.on {
    background: var(--ink);
    color: #111;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  }

  /* Right Column: Palette Theme Sidebar */
  .theme-sidebar {
    background: var(--panel);
    border-left: 1px solid var(--line);
    padding: 18px 16px 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .sidebar-header {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--mute);
    margin-bottom: 2px;
    font-weight: 700;
  }
  .theme-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 14px;
    cursor: pointer;
    border: 1px solid transparent;
    background: var(--panel2);
    transition: all 0.2s ease;
  }
  .theme-card:hover {
    border-color: rgba(255, 255, 255, 0.16);
    transform: translateX(-2px);
  }
  .theme-card.on {
    border-color: var(--accent);
    background: rgba(255, 179, 25, 0.1);
  }
  .color-chips {
    display: flex;
    border-radius: 8px;
    overflow: hidden;
    width: 52px;
    height: 30px;
    flex: none;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12);
  }
  .color-chips i { flex: 1; height: 100%; display: block; }
  .theme-info {
    flex: 1;
    min-width: 0;
  }
  .theme-info .title {
    font-size: 13.5px;
    font-weight: 700;
    margin-bottom: 1px;
  }
  .theme-info .sub {
    font-size: 11px;
    color: var(--mute);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sidebar-footer {
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: #D1D4DE;
  }

  /* Minimal Switch */
  .switch {
    width: 42px;
    height: 24px;
    border-radius: 999px;
    background: #2C2E3C;
    position: relative;
    cursor: pointer;
    transition: 0.25s;
    flex: none;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #9094A6;
    transition: 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .switch.on { background: var(--accent); }
  .switch.on::after { left: 20px; background: #111; }

  /* ========================================================================= */
  /* Page 2: Combat Page                                                       */
  /* ========================================================================= */
  .combat-layout {
    height: calc(100vh - 76px);
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    max-width: 880px;
    margin: 0 auto;
    padding: 24px 40px 36px;
    gap: 20px;
    overflow-y: auto;
  }
  .combat-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .combat-card {
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 26px;
    display: flex;
    flex-direction: column;
    gap: 32px;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }
  .combat-card:hover {
    transform: translateY(-2px);
    border-color: rgba(255, 255, 255, 0.18);
  }
  .combat-card.on {
    background: linear-gradient(160deg, rgba(255, 179, 25, 0.15), rgba(255, 179, 25, 0.02));
    border-color: rgba(255, 179, 25, 0.5);
  }
  .combat-card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .combat-card-top svg {
    width: 34px;
    height: 34px;
    stroke: var(--accent);
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .combat-card h3 {
    font-size: 21px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .combat-card p {
    font-size: 13px;
    color: var(--mute);
  }

  /* Damage Multiplier Box */
  .damage-box {
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 26px 34px 30px;
  }
  .damage-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 24px;
  }
  .damage-header .title-grp h3 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .damage-header .title-grp p {
    font-size: 13px;
    color: var(--mute);
  }
  .damage-header .val-badge {
    font-size: 32px;
    font-weight: 900;
    color: var(--accent);
    letter-spacing: -0.5px;
  }
  .slider-rail {
    position: relative;
    height: 8px;
    background: #272A38;
    border-radius: 999px;
    margin: 18px 12px 14px;
  }
  .slider-fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    background: linear-gradient(90deg, #FFB319, #FF7B00);
    border-radius: 999px;
    transition: width 0.28s ease;
  }
  .slider-stops {
    position: absolute;
    inset: 0;
  }
  .slider-stop {
    position: absolute;
    top: 50%;
    width: 24px;
    height: 24px;
    margin: -12px 0 0 -12px;
    border-radius: 50%;
    background: #272A38;
    border: 3px solid var(--panel2);
    cursor: pointer;
    transition: all 0.22s ease;
  }
  .slider-stop.pass { background: var(--accent); }
  .slider-stop.on {
    background: #fff;
    transform: scale(1.3);
    box-shadow: 0 0 0 5px var(--accent-glow);
  }
  .slider-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 24px;
    font-size: 13.5px;
    color: var(--mute);
  }
  .slider-labels span {
    width: 60px;
    text-align: center;
    cursor: pointer;
    margin: 0 -16px;
    transition: 0.2s;
  }
  .slider-labels span.on {
    color: var(--ink);
    font-weight: 700;
  }

  /* ========================================================================= */
  /* Page 3: Tools Page                                                        */
  /* ========================================================================= */
  .tools-layout {
    height: calc(100vh - 76px);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    max-width: 880px;
    margin: 0 auto;
    padding: 50px 40px;
    align-content: center;
  }
  .tool-tile {
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 30px 26px;
    color: var(--ink);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: space-between;
    height: 160px;
    font-family: inherit;
    transition: all 0.25s ease;
    text-align: left;
  }
  .tool-tile:hover {
    background: #20222D;
    transform: translateY(-3px);
    border-color: rgba(255, 179, 25, 0.4);
    box-shadow: 0 12px 28px -10px rgba(0, 0, 0, 0.5);
  }
  .tool-tile-top {
    width: 44px;
    height: 44px;
    border-radius: 13px;
    background: rgba(255, 179, 25, 0.12);
    display: grid;
    place-items: center;
  }
  .tool-tile-top svg {
    width: 22px;
    height: 22px;
    stroke: var(--accent);
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .tool-tile-body h4 {
    font-size: 17.5px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .tool-tile-body p {
    font-size: 12.5px;
    color: var(--mute);
  }

  /* ========================================================================= */
  /* Bottom Global Control Dock                                                */
  /* ========================================================================= */
  .dock {
    height: 76px;
    flex: none;
    border-top: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 24px;
    position: relative;
    z-index: 10;
  }
  .ticker {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 12px;
    font: 13px "Cascadia Mono", Consolas, monospace;
    color: var(--mute);
    cursor: pointer;
    min-width: 0;
    height: 44px;
    padding: 0 12px;
    border-radius: 12px;
    transition: 0.2s;
  }
  .ticker:hover {
    background: rgba(255, 255, 255, 0.04);
    color: var(--ink);
  }
  .ticker-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 8px var(--ok);
    flex: none;
  }
  .ticker-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ticker-arrow {
    font-size: 11px;
    opacity: 0.5;
  }

  .btn {
    border: 0;
    border-radius: 14px;
    padding: 0 22px;
    height: 44px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn.outline {
    background: transparent;
    color: var(--ink);
    border: 1.5px solid rgba(255, 255, 255, 0.16);
  }
  .btn.outline:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(255, 179, 25, 0.05);
  }
  .btn.primary {
    background: linear-gradient(135deg, #FFC038, #FF9500);
    color: #111;
    padding: 0 30px;
    box-shadow: 0 8px 22px -6px rgba(255, 160, 0, 0.5);
  }
  .btn.primary:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
    box-shadow: 0 10px 26px -6px rgba(255, 160, 0, 0.7);
  }
  .btn.primary:active { transform: translateY(0); }
  .btn .progress-bar {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 3px;
    width: 0;
    background: var(--accent);
    transition: width 0.3s ease;
  }

  /* Log Drawer Sheet */
  .log-drawer {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 76px;
    height: 270px;
    background: rgba(14, 15, 20, 0.96);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
    padding: 16px 26px;
    overflow-y: auto;
    transform: translateY(110%);
    transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 9;
    font: 12.5px / 1.8 "Cascadia Mono", Consolas, monospace;
    color: #9AA0B4;
    display: flex;
    flex-direction: column;
    pointer-events: none;
  }
  .log-drawer.open { transform: none; pointer-events: auto; }
  .log-drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 8px;
    flex: none;
    font-size: 12px;
    color: var(--mute);
    text-transform: uppercase;
  }
  .log-drawer-header button {
    background: transparent;
    border: 0;
    color: var(--mute);
    cursor: pointer;
    font: inherit;
  }
  .log-drawer-header button:hover { color: var(--ink); }
  .log-content { flex: 1; overflow-y: auto; }
  .log-content p { display: flex; gap: 12px; margin: 2px 0; }
  .log-content p .time { color: #535868; flex: none; }
  .log-content p.ok { color: var(--ok); }
  .log-content p.err { color: var(--danger); }
  .log-content p.warn { color: var(--warn); }

  /* Toast Notification */
  .toast {
    position: absolute;
    left: 50%;
    top: 24px;
    transform: translate(-50%, -20px);
    background: #242734;
    color: #fff;
    padding: 9px 20px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 100;

});

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const rootStyle = document.documentElement.style;

// Mount SVG Figure
$("#figureBox").innerHTML = SVG_FIGURE;

/* Helper to get theme by ID */
function getThemeById(themeId) {
  return THEMES.find(t => t.id === themeId) || THEMES[0];
}

/* ========================================================================= */
/* UI Rendering & State Sync                                                 */
/* ========================================================================= */

// Render the 36-character list in the left column
function renderCharacterList() {
  const container = $("#charScrollBox");
  container.innerHTML = "";

  CHARACTERS.forEach((c, idx) => {
    const skinInfo = state.characterSkins[c.id] || { themeId: "classic" };
    const theme = getThemeById(skinInfo.themeId);
    const isModded = theme.id !== "classic";
    const isActive = c.id === state.activeCharId;

    const row = document.createElement("div");
    row.className = "char-row" + (isActive ? " on" : "");
    row.id = `char-row-${c.id}`;

    row.innerHTML = `
      <div class="char-row-left">
        <span class="idx">${String(idx + 1).padStart(2, '0')}</span>
        <span class="name">${c.name}</span>
      </div>
      <div class="char-skin-tag ${isModded ? 'modded' : ''}" id="skin-tag-${c.id}">
        <span class="char-skin-dot" style="background:${theme.hair};"></span>
        <span>${theme.shortName}</span>
      </div>
    `;

    row.onclick = () => selectCharacter(c.id);
    container.appendChild(row);
  });
}

// Select a character and update the center stage & right theme sidebar
function selectCharacter(charId, silent = false) {
  state.activeCharId = charId;
  const char = CHARACTERS.find(c => c.id === charId) || CHARACTERS[27];
  const skinInfo = state.characterSkins[charId] || { themeId: "classic" };
  const theme = getThemeById(skinInfo.themeId);

  // Update Left List Highlights
  $$(".char-row").forEach(r => r.classList.remove("on"));
  const activeRow = $(`#char-row-${charId}`);
  if (activeRow) {
    activeRow.classList.add("on");
    // Ensure active row is smoothly visible in scroll
    activeRow.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  // Update Center Stage
  $("#watermark").textContent = char.name;
  $("#bannerCharName").textContent = char.name;
  $("#bannerThemeName").textContent = theme.name;

  // Update Figure Colors
  updateFigureColors(theme);

  // Update Right Theme Cards selection
  $$(".theme-card").forEach(c => {
    c.classList.toggle("on", c.dataset.tid === theme.id);
  });

  // Notify backend of active character switch
  if (!silent) {
    callBackend("update_active_character", { char_id: char.id });
  }
}

// Update SVG figure and stage glow colors
function updateFigureColors(theme) {
  rootStyle.setProperty("--coat", theme.coat);
  rootStyle.setProperty("--shirt", theme.shirt);
  rootStyle.setProperty("--hair", theme.hair);
  rootStyle.setProperty("--pants", theme.pants);
  rootStyle.setProperty("--shoes", theme.shoes);
  rootStyle.setProperty("--glow", theme.hair);
}

// Apply theme to current character or all characters
function applyTheme(themeId) {
  const theme = getThemeById(themeId);

  if (state.scope === "ALL") {
    // Bulk apply to all 36 characters
    CHARACTERS.forEach(c => {
      state.characterSkins[c.id] = {
        themeId: theme.id,
        colors: [...theme.colors]
      };
      // Update badge in character list
      const tag = $(`#skin-tag-${c.id}`);
      if (tag) {
        tag.className = `char-skin-tag ${theme.id !== 'classic' ? 'modded' : ''}`;
        tag.innerHTML = `<span class="char-skin-dot" style="background:${theme.hair};"></span><span>${theme.shortName}</span>`;
      }
    });

    toast(`已批量应用【${theme.name}】至全部 36 位角色`);
    log(`已批量应用调色板【${theme.name}】至全员 36 角色`, "INFO");

  } else {
    // Apply specifically to the current active character
    state.characterSkins[state.activeCharId] = {
      themeId: theme.id,
      colors: [...theme.colors]
    };

    // Update single character badge in left list
    const tag = $(`#skin-tag-${state.activeCharId}`);
    if (tag) {
      tag.className = `char-skin-tag ${theme.id !== 'classic' ? 'modded' : ''}`;
      tag.innerHTML = `<span class="char-skin-dot" style="background:${theme.hair};"></span><span>${theme.shortName}</span>`;
    }

    const char = CHARACTERS.find(c => c.id === state.activeCharId);
    toast(`已为【${char ? char.name : ''}】设置皮肤：${theme.name}`);
    log(`角色【${char ? char.name : ''}】皮肤已更新为: ${theme.name}`, "INFO");
  }

  // Update center stage
  $("#bannerThemeName").textContent = theme.name;
  updateFigureColors(theme);

  // Update theme card active styles
  $$(".theme-card").forEach(c => {
    c.classList.toggle("on", c.dataset.tid === theme.id);
  });

  // Sync to Python backend per-character store
  callBackend("set_character_skin", {
    char_id: state.activeCharId,
    theme_id: theme.id,
    scope: state.scope,
    colors: theme.colors
  });
}

// Build Right Theme Cards
THEMES.forEach((t) => {
  const card = document.createElement("div");
  card.className = "theme-card";
  card.dataset.tid = t.id;
  card.innerHTML = `
    <div class="color-chips">
      <i style="background:${t.coat}"></i>
      <i style="background:${t.shirt}"></i>
      <i style="background:${t.hair}"></i>
      <i style="background:${t.pants}"></i>
    </div>
    <div class="theme-info">
      <div class="title">${t.name}</div>
      <div class="sub">${t.sub}</div>
    </div>
  `;
  card.onclick = () => applyTheme(t.id);
  $("#themeList").appendChild(card);
});

// Scope Switcher
$$("#scopePill button").forEach(b => {
  b.onclick = () => {
    $$("#scopePill button").forEach(x => x.classList.toggle("on", x === b));
    state.scope = b.dataset.v;
    callBackend("update_scope", { scope: state.scope });
    toast(state.scope === "ALL" ? "当前模式：批量应用全员 36 角色" : "当前模式：仅应用当前选定角色");
  };
});

// Avatar Portrait Sync Switch
$("#swAvatar").onclick = () => {
  state.syncAvatar = !state.syncAvatar;
  $("#swAvatar").classList.toggle("on", state.syncAvatar);
  callBackend("update_sync_avatar", { sync: state.syncAvatar });
  toast(state.syncAvatar ? "已开启头像发色联动同步" : "已关闭头像发色联动同步");
};

// Combat Page Switches
function bindCombatToggle(cardId, switchId, key, label) {
  const card = $(cardId);
  const sw = $(switchId);
  const toggle = () => {
    state[key] = !state[key];
    card.classList.toggle("on", state[key]);
    sw.classList.toggle("on", state[key]);
    callBackend("update_combat_rule", { rule: key, value: state[key] });
    toast((state[key] ? "已启用" : "已禁用") + "：" + label);
  };
  card.onclick = toggle;
}
bindCombatToggle("#cardGuard", "#swGuard", "guard", "免破防 (Guard 锁死 103 点)");
bindCombatToggle("#cardStun", "#swStun", "stun", "免眩晕 (Stun 锁死 103 点)");

// Infinite Power Toggle
const cardPower = $("#cardPower");
const swPower = $("#swPower");
cardPower.onclick = () => {
  state.infinitePower = !state.infinitePower;
  cardPower.classList.toggle("on", state.infinitePower);
  swPower.classList.toggle("on", state.infinitePower);
  callBackend("update_infinite_power", { value: state.infinitePower });
  toast((state.infinitePower ? "已启用" : "已禁用") + "：无限能量 (初始3气+超杀爆气零消耗)");
};

// Dizzy Duration Input Box
const inputDizzy = $("#inputDizzyTime");
const dizzyHint = $("#dizzyHint");
function onDizzyChange() {
  let val = parseFloat(inputDizzy.value);
  if (isNaN(val) || val < 0.5) val = 0.5;
  if (val > 30.0) val = 30.0;
  state.dizzyDuration = val;
  inputDizzy.value = val.toFixed(1);
  dizzyHint.textContent = `打晕后持续硬直 ${val.toFixed(1)} 秒（原版约4.3秒，免眩晕关闭时生效）`;
  callBackend("update_dizzy_duration", { value: val });
  toast(`眩晕持续时间已设置为: ${val.toFixed(1)} 秒`);
}
inputDizzy.addEventListener("change", onDizzyChange);
inputDizzy.addEventListener("keydown", (e) => {
  if (e.key === "Enter") onDizzyChange();
});

// Damage Multiplier Slider
const nModes = DAMAGE_MODES.length;
DAMAGE_MODES.forEach((m, i) => {
  const stop = document.createElement("div");
  stop.className = "slider-stop";
  stop.style.left = (i / (nModes - 1) * 100) + "%";
  stop.onclick = () => setDamage(i);
  $("#sliderStops").appendChild(stop);

  const label = document.createElement("span");
  label.textContent = m.label;
  label.onclick = () => setDamage(i);
  $("#sliderLabels").appendChild(label);
});

function setDamage(idx, silent = false) {
  state.damageIdx = idx;
  const m = DAMAGE_MODES[idx];
  $("#damageVal").textContent = m.badge;
  $("#damageDesc").textContent = m.desc;
  $("#sliderFill").style.width = (idx / (nModes - 1) * 100) + "%";

  $$(".slider-stop").forEach((s, j) => {
    s.classList.toggle("on", j === idx);
    s.classList.toggle("pass", j < idx);
  });
  $$("#sliderLabels span").forEach((l, j) => {
    l.classList.toggle("on", j === idx);
  });

  if (!silent) {
    callBackend("update_damage_mode", { mode_id: m.id });
  }
}

// Left Icon Rail Navigation
$$(".nav").forEach(b => {
  b.onclick = () => {
    $$(".nav").forEach(x => x.classList.toggle("on", x === b));
    $$(".page").forEach(p => p.classList.toggle("on", p.id === "pg-" + b.dataset.p));
  };
});

// Tool Tiles
$$(".tool-tile").forEach(t => {
  t.onclick = () => {
    const act = t.dataset.act;
    if (act === "unpack") {
      log("正在执行原生 ROM 重新解包...", "INFO");
      callBackend("unpack_rom");
    } else if (act === "restore") {
      log("正在还原官方原版基准风云再起...", "INFO");
      callBackend("restore_baseline").then(() => {
        // Reset all local skin mappings to classic
        CHARACTERS.forEach(c => {
          state.characterSkins[c.id] = { themeId: "classic", colors: [...THEMES[0].colors] };
        });
        renderCharacterList();
        selectCharacter(state.activeCharId);
        toast("已成功还原官方原版基准！全员皮肤已复原。");
      });
    } else if (act === "selftest") {
      log("正在执行全局工具链自检 (bswap16/LSPC2/瓦片)...", "INFO");
      callBackend("run_self_test");
    } else if (act === "openoutput") {
      log("正在打开 ROM 输出交付目录...", "INFO");
      callBackend("open_output_dir");
    }
  };
});

// Logs & Ticker
const logDrawer = $("#logDrawer");
$("#tickerBtn").onclick = () => logDrawer.classList.toggle("open");
$("#btnCloseLog").onclick = () => logDrawer.classList.remove("open");
$("#btnClearLog").onclick = () => {
  $("#logContent").innerHTML = "";
  $("#tickerText").textContent = "日志已清空";
};

function log(msg, level = "INFO") {
  const p = document.createElement("p");
  if (level === "SUCCESS" || level === "PASS") p.className = "ok";
  else if (level === "ERROR" || level === "FAIL") p.className = "err";
  else if (level === "WARN") p.className = "warn";

  const timeStr = new Date().toLocaleTimeString("zh-CN", { hour12: false });
  p.innerHTML = `<span class="time">${timeStr}</span><span>${msg}</span>`;
  $("#logContent").prepend(p);
  $("#tickerText").textContent = msg;
}

// Toast
let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
}

// Core Action Buttons
$("#btnSave").onclick = () => {
  log("正在保存全员配置与皮肤列表...", "INFO");
  callBackend("save_skin").then(res => {
    toast(res && res.msg ? res.msg : "所有角色配置保存成功");
  });
};

$("#btnPack").onclick = () => {
  const bar = $("#packProgress");
  bar.style.transition = "none";
  bar.style.width = "0%";
  requestAnimationFrame(() => {
    bar.style.transition = "width 1.2s ease";
    bar.style.width = "100%";
  });
  log("=== 开始执行【打包Rom】全量流水线 ===", "INFO");
  callBackend("pack_rom").then(res => {
    setTimeout(() => {
      bar.style.width = "0%";
      if (res && res.success) {
        toast("ROM 打包成功！CRC32: 0x" + res.crc32);
        log("ROM 打包成功: " + res.crc32, "SUCCESS");
      } else {
        toast("打包失败: " + (res ? res.error : "未知错误"));
      }
    }, 1200);
  });
};

$("#btnStartGame").onclick = () => {
  log("正在启动沙盒模拟器 WinKawaks...", "INFO");
  toast("启动模拟器中...");
  callBackend("start_game").then(res => {
    if (res && res.success) {
      log("WinKawaks 模拟器已成功启动！(PID=" + res.pid + ")", "SUCCESS");
      toast("模拟器启动成功！");
    } else {
      toast("启动失败: " + (res ? res.error : "未知错误"));
    }
  });
};

/* ========================================================================= */
/* PyWebView Bridge Integration                                              */
/* ========================================================================= */
function callBackend(fn, args = {}) {
  if (window.pywebview && window.pywebview.api && typeof window.pywebview.api[fn] === "function") {
    return window.pywebview.api[fn](args).catch(err => {
      log("调用失败 [" + fn + "]: " + err, "ERROR");
      return { success: false, error: String(err) };
    });
  }
  // Fallback for standalone browser testing
  return new Promise(resolve => {
    setTimeout(() => {
      resolve({ success: true, msg: "操作成功 (本地预览模式)" });
    }, 150);
  });
}

// Push log callback called from Python
window.onBackendLog = function(msg, level) {
  log(msg, level);
};

// Initial state sync callback from Python
window.onBackendState = function(s) {
  if (s.character_skins) {
    Object.keys(s.character_skins).forEach(cidStr => {
      const cid = parseInt(cidStr, 10);
      state.characterSkins[cid] = s.character_skins[cidStr];
    });
  }
  if (s.char_id !== undefined) {
    state.activeCharId = s.char_id;
  }
  if (s.guard !== undefined) {
    state.guard = !!s.guard;
    $("#cardGuard").classList.toggle("on", state.guard);
    $("#swGuard").classList.toggle("on", state.guard);
  }
  if (s.stun !== undefined) {
    state.stun = !!s.stun;
    $("#cardStun").classList.toggle("on", state.stun);
    $("#swStun").classList.toggle("on", state.stun);
  }
  if (s.infinite_power !== undefined) {
    state.infinitePower = !!s.infinite_power;
    $("#cardPower").classList.toggle("on", state.infinitePower);
    $("#swPower").classList.toggle("on", state.infinitePower);
  }
  if (s.dizzy_duration !== undefined) {
    state.dizzyDuration = parseFloat(s.dizzy_duration) || 5.0;
    $("#inputDizzyTime").value = state.dizzyDuration.toFixed(1);
    $("#dizzyHint").textContent = `打晕后持续硬直 ${state.dizzyDuration.toFixed(1)} 秒（原版约4.3秒，免眩晕关闭时生效）`;
  }
  if (s.damage_mode !== undefined) {
    const idx = DAMAGE_MODES.findIndex(d => d.id === s.damage_mode);
    if (idx >= 0) setDamage(idx, true);
  }
  if (s.sync_avatar !== undefined) {
    state.syncAvatar = !!s.sync_avatar;
    $("#swAvatar").classList.toggle("on", state.syncAvatar);
  }
  if (s.scope !== undefined) {
    state.scope = s.scope;
    $$("#scopePill button").forEach(b => b.classList.toggle("on", b.dataset.v === s.scope));
  }

  // Refresh character list and stage
  renderCharacterList();
  selectCharacter(state.activeCharId, true);
  log("工作台已与本地保存的配置同步就绪 (已恢复破防/免眩/伤害与皮肤配置)。", "INFO");
};

// Initial state loader
function initBackendState() {
  callBackend("get_initial_state").then(s => {
    if (s && window.onBackendState) window.onBackendState(s);
  });
}

// Listen for PyWebView ready event
window.addEventListener("pywebviewready", initBackendState);
if (window.pywebview && window.pywebview.api) {
  initBackendState();
}

// Initial boot
renderCharacterList();
selectCharacter(state.activeCharId, true);
setDamage(state.damageIdx, true);
log("拳皇97 逆向魔改工作台 (深色舞台 B 版) 已加载完毕。", "INFO");
</script>
</body>
</html>
